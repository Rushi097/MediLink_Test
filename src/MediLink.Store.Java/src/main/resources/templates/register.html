<!doctype html>
<html lang="en" xmlns:th="https://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register medical store · MediLink</title>
    <link rel="stylesheet" th:href="@{/css/store.css}">
</head>

<body class="login-page">
    <main class="login-card register-card"><span class="eyebrow">MEDILINK · STORE PORTAL</span>
        <h1>Register your medical store.</h1>
        <p>Create the login used only for this store-owner portal.</p>
        <div class="notice error" th:if="${#fields.hasGlobalErrors()}" th:each="error : ${#fields.globalErrors()}"
            th:text="${error}">Registration error</div>
        <form th:action="@{/register}" th:object="${form}" method="post" class="stack">
            <div class="two-fields"><label>First name<input th:field="*{firstName}" required></label><label>Last
                    name<input th:field="*{lastName}" required></label></div><label>Email<input th:field="*{email}"
                    type="email" autocomplete="email" required></label><label>Password<input th:field="*{password}"
                    type="password" autocomplete="new-password" minlength="8" required></label><label>Medical store
                name<input th:field="*{storeName}" required></label><label>Drug licence number<input
                    th:field="*{businessLicenseNumber}" required></label><label>Store address<textarea
                    th:field="*{storeAddress}" rows="2" required></textarea></label><button type="submit">Create
                store-owner account</button>
        </form>
        <p class="login-switch">Already registered? <a th:href="@{/login}">Sign in to your store</a></p>
    </main>
</body>

</html>
