<!doctype html>
<html lang="en" xmlns:th="https://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Orders · MediLink Store</title><link rel="stylesheet" th:href="@{/css/store.css}"></head>
<body><header th:replace="~{fragments :: header}"></header><main class="container"><section class="page-heading"><div><span class="eyebrow">FULFILMENT</span><h1>Orders & deliveries</h1><p>Claim an order, view delivery details, and update its progress.</p></div></section>
  <section class="panel"><div class="empty" th:if="${#lists.isEmpty(orders)}">No customer orders have been placed yet.</div><div class="order-list" th:unless="${#lists.isEmpty(orders)}"><article class="order" th:each="order : ${orders}"><div class="order-top"><div><strong th:text="'Order #' + ${#strings.substring(order.id.toString(),0,8)}">Order</strong><span th:text="${#temporals.format(order.createdAt, 'dd MMM yyyy, HH:mm')}">Date</span></div><b th:text="'₹' + ${order.totalAmount}">₹0</b></div><div class="order-grid"><div><small>CUSTOMER</small><p th:text="${customers[order.userId].firstName + ' ' + customers[order.userId].lastName}">Customer</p></div><div><small>PHONE</small><p th:text="${customerProfiles[order.userId] != null ? customerProfiles[order.userId].phoneNumber : 'Not supplied'}">Phone</p></div><div class="delivery"><small>DELIVERY ADDRESS</small><p th:text="${order.deliveryAddress}">Address</p></div></div><div class="order-actions" th:if="${!claimed.contains(order.id)}"><form th:action="@{/orders/{id}/claim(id=${order.id})}" method="post"><button type="submit">Claim for my store</button></form><span>Available for fulfilment</span></div><div class="order-actions" th:if="${claimed.contains(order.id)}"><form th:action="@{/orders/{id}/status(id=${order.id})}" method="post"><select name="status"><option value="1" th:selected="${order.status == 1}">Confirmed</option><option value="2" th:selected="${order.status == 2}">Shipped</option><option value="3" th:selected="${order.status == 3}">Delivered</option></select><button type="submit" class="secondary">Update status</button></form><span class="claimed">Assigned to your store</span></div></article></div></section>
</main></body></html>
