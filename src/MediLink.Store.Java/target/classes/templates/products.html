<!doctype html>
<html lang="en" xmlns:th="https://www.thymeleaf.org">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inventory · MediLink Store</title>
  <link rel="stylesheet" th:href="@{/css/store.css}">
</head>

<body>
  <header th:replace="~{fragments :: header}"></header>
  <main class="container">
    <section class="page-heading">
      <div><span class="eyebrow">PRODUCT CATALOGUE</span>
        <h1>Inventory</h1>
        <p>Add medicines, upload a product image, and keep availability current.</p>
      </div>
    </section>
    <div class="notice success" th:if="${param.created}">Product added to your store inventory.</div>
    <div class="notice success" th:if="${param.updated}">Product information updated.</div>
    <section class="panel">
      <h2>Add available product</h2>
      <form th:action="@{/products}" th:object="${form}" method="post" enctype="multipart/form-data"
        class="product-form"><label>Name<input th:field="*{name}" required></label><label>Category<input
            th:field="*{category}" placeholder="e.g. Fever & pain" required></label><label>Price (₹)<input
            th:field="*{price}" type="number" step="0.01" min="0.01" required></label><label>Available units<input
            th:field="*{stockQuantity}" type="number" min="0" required></label><label class="wide">Description<textarea
            th:field="*{description}" rows="2" required></textarea></label><label class="wide">Product image <input
            th:field="*{image}" type="file" accept="image/*"></label><button type="submit">Add to inventory</button>
      </form>
    </section>
    <section class="panel">
      <h2>Your products <span class="count" th:text="${#lists.size(products)}">0</span></h2>
      <div class="empty" th:if="${#lists.isEmpty(products)}">No products yet. Add your first available medicine above.
      </div>
      <div class="product-list" th:unless="${#lists.isEmpty(products)}">
        <article class="product" th:each="product : ${products}"><img th:if="${product.imageUrl}"
            th:src="${product.imageUrl}" alt="Product image">
          <div class="product-placeholder" th:unless="${product.imageUrl}">Rx</div>
          <form th:action="@{/products/{id}(id=${product.id})}" method="post" enctype="multipart/form-data"
            class="product-form compact"><label>Name<input name="name" th:value="${product.name}"
                required></label><label>Category<input name="category" th:value="${product.category}"
                required></label><label>Price (₹)<input name="price" type="number" step="0.01" min="0.01"
                th:value="${product.price}" required></label><label>Units<input name="stockQuantity" type="number"
                min="0" th:value="${product.stockQuantity}" required></label><label class="wide">Description<textarea
                name="description" rows="2" th:text="${product.description}" required></textarea></label><label
              class="wide">Replace image <input name="image" type="file" accept="image/*"></label>
            <div class="wide product-footer"><span
                th:classappend="${product.stockQuantity <= 10} ? 'stock low' : 'stock'"
                th:text="${product.stockQuantity <= 10 ? 'Low stock' : 'In stock'}">In stock</span><button type="submit"
                class="secondary">Save changes</button></div>
          </form>
        </article>
      </div>
    </section>
  </main>
</body>

</html>
